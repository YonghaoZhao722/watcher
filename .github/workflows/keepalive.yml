name: keepalive

# Public-repo scheduled workflows are disabled after 60 days without repo activity.
# A monthly commit resets that timer so the 10-minute watch schedule keeps running.
on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    if: github.repository == 'YonghaoZhao722/trader-watch'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Touch keepalive timestamp
        run: |
          date -u +%Y-%m-%dT%H:%M:%SZ > .keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "chore: keepalive $(date -u +%Y-%m-%d)"
            git push
          fi
